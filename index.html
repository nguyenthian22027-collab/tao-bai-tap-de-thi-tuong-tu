<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimilarExam Studio — Tạo Đề Thi Tương Tự GDPT 2025</title>
    <meta name="description" content="Tạo đề thi tương tự chuẩn cấu trúc GDPT 2025 (4 lựa chọn, Đúng/Sai, Trả lời ngắn, Tự luận) với công thức toán LaTeX, OMML và MathType." />
    <meta property="og:title" content="SimilarExam Studio — Tạo Đề Thi Tương Tự GDPT 2025" />
    <meta property="og:description" content="Tạo đề thi tương tự chuẩn cấu trúc GDPT 2025 (4 lựa chọn, Đúng/Sai, Trả lời ngắn, Tự luận) với công thức toán LaTeX, OMML và MathType." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Be Vietnam Pro & Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@600;700&display=swap" rel="stylesheet">

    <!-- MathJax 3 configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          macros: {
            wideparen: ['\\overset{\\Large\\frown}{#1}', 1],
            overgroup: ['\\overset{\\Large\\frown}{#1}', 1],
            arc: ['\\overset{\\Large\\frown}{#1}', 1],
            sd: '\\text{sđ}'
          }
        },
        options: {
          ignoreHtmlClass: 'tex2jax_ignore',
          processHtmlClass: 'tex2jax_process'
        },
        startup: {
          pageReady: () => {
            return window.MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
    <!-- MathJax 3 -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- TikZJax: WebAssembly TeX engine for rendering TikZ to SVG in browser -->
    <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
    <script src="https://tikzjax.com/v1/tikzjax.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
